name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match versionName
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease
      - name: Verify APK versions and signing key
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          [ -n "$RELEASE_CERT_SHA256" ] || { echo "Repository variable RELEASE_CERT_SHA256 is not set"; exit 1; }
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          for MODULE in app wear; do
            [ "$(ls $MODULE/build/outputs/apk/release/*.apk | wc -l)" = 1 ] || { echo "Expected exactly one release APK in $MODULE"; exit 1; }
            APK=$(ls $MODULE/build/outputs/apk/release/*.apk)
            "$TOOLS/aapt2" dump badging "$APK" | grep -q "versionName='${GITHUB_REF_NAME#v}'" \
              || { echo "$APK does not contain version ${GITHUB_REF_NAME#v}"; exit 1; }
            CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p')
            [ "$CERT" = "$RELEASE_CERT_SHA256" ] || { echo "$APK is signed with $CERT, expected $RELEASE_CERT_SHA256"; exit 1; }
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `make publish` may already have created this release from a local build.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, nothing to do."
            exit 0
          fi
          mkdir dist
          cp app/build/outputs/apk/release/*.apk wear/build/outputs/apk/release/*.apk dist/
          (cd dist && sha256sum *.apk > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Pomodoro $GITHUB_REF_NAME" --generate-notes
